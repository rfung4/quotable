[project]
name = "quotable-mcp"
version = "0.2.0"
description = "Local-first MCP server and CLI that turns recordings, podcast feeds and media URLs into cite-ready transcripts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ross Fung" }]
requires-python = ">=3.10"
keywords = ["mcp", "transcription", "whisper", "podcast", "diarization", "captions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "mcp>=2.3,<2.4",  # daemon.py uses MCPServer._lowlevel_server (private)
  "yt-dlp[default]>=2026.8.19",
  "faster-whisper>=1.2.1",
  "av>=11,<19",
  "filelock>=3.10",
  "pydantic>=2.12",
]

[project.optional-dependencies]
diarize = ["pyannote.audio>=4"]

[project.scripts]
quotable = "quotable.cli:main"
quotable-mcp = "quotable.cli:main"  # so `uvx quotable-mcp` needs no --from

[project.urls]
Repository = "https://github.com/rfung4/quotable"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotable"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "black>=24", "isort>=5.13"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: real model / real stdio, no network (deselected by default)",
  "diarize: needs the diarize extra and a Hugging Face token (deselected by default)",
]
addopts = "-m 'not integration and not diarize'"

[tool.uv]
# onnxruntime (faster-whisper's VAD) ships no Python 3.10 wheels from 1.24 on while its metadata
# still allows 3.10, so the universal lock would pin a version `uv sync` cannot install there.
constraint-dependencies = ["onnxruntime<1.24; python_full_version < '3.11'"]
